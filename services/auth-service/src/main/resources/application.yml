spring:
  application:
    name: auth-service

  profiles:
    active: local

  jpa:
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    open-in-view: false

server:
  port: 8081
  shutdown: graceful

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
    display-request-duration: true
  show-actuator: false
  packages-to-scan: com.workspace.auth.adapters.controllers

auth:
  jwt:
    issuer: workspace-booking-platform
    access-token-expiration-minutes: 15
    refresh-token-expiration-days: 7

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%logger{36}] - %msg%n"