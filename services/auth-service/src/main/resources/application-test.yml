spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/auth_db_test
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

auth:
  jwt:
    secret: test-secret-key-must-be-at-least-256-bits-long-for-hs256

logging:
  level:
    root: WARN
    com.workspace.auth: INFO